name: Build Repertory Database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and Python tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql python3-psycopg2 && sudo systemctl start postgresql
      - name: Download and restore OOREP database
        run: |
          curl -L -o oorep.sql.gz https://github.com/nondeterministic/oorep/raw/master/oorep.sql.gz
          gunzip oorep.sql.gz
          sudo -u postgres psql -c "CREATE USER oorep_user WITH SUPERUSER PASSWORD 'oorep';"
          sudo -u postgres psql -c "CREATE DATABASE oorep OWNER oorep_user;"
          sudo -u postgres psql -d oorep -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          if head -c 5 oorep.sql | grep -q "PGDMP"; then sudo -u postgres pg_restore -d oorep --no-owner --no-privileges oorep.sql || true; else sudo -u postgres psql -d oorep -f oorep.sql > /dev/null; fi
      - name: Export repertories to JSON
        run: python3 scripts/export_db.py
      - name: Commit JSON database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Build open-source repertory JSON database" || echo "No changes"
          git push
