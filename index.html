<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Repertory" />
  <title>Synthesis-Style Repertory</title>
  <style>
    :root {
      --bg: #eef2f5; --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --border: #d8e0e8; --nav-bg: #3b5b70; --nav-sub: #4f738a;
      --nav-active: #274050; --primary: #2d6a8e; --primary-soft: #e0f2fe;
      --g3: #c81e1e; --g2: #1d4ed8; --g1: #334155;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    body.dark {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
      --border: #334155; --nav-bg: #162433; --nav-sub: #1e3348;
      --nav-active: #0f172a; --primary: #38bdf8; --primary-soft: #0c4a6e;
      --g3: #f87171; --g2: #60a5fa; --g1: #cbd5e1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg); color: var(--text);
      padding-bottom: calc(18px + var(--safe-bot));
    }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: var(--nav-bg); color: #fff;
      padding-top: var(--safe-top);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .nav-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .nav-item {
      background: transparent; border: none; color: rgba(255,255,255,0.85);
      padding: 8px 4px; font-size: 11px; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      border-right: 1px solid rgba(255,255,255,0.08); cursor: pointer; position: relative;
    }
    .nav-item.active { background: var(--nav-active); color: #fff; }
    .nav-item .ico { font-size: 16px; line-height: 1; }
    .subbar {
      background: var(--nav-sub); padding: 7px 10px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .sub-btn {
      background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .crumb-pills { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 100px; }
    .crumb-pill {
      background: #f1f5f9; color: #1e293b; border: none; border-radius: 6px;
      padding: 4px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .rep-select {
      max-width: 140px; background: rgba(0,0,0,0.22); color: #fff;
      border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 5px 6px; font-size: 12px;
    }
    .badge {
      position: absolute; top: 4px; right: 16%;
      background: #ef4444; color: #fff; border-radius: 999px;
      padding: 1px 5px; font-size: 10px; font-weight: 700;
    }
    .container { padding: 10px; max-width: 820px; margin: 0 auto; }
    .search-box {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: 15px; margin-bottom: 10px;
    }
    .chapter-list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .chapter-row {
      width: 100%; background: var(--card); border: none; border-bottom: 1px solid var(--border);
      padding: 10px 12px; display: flex; align-items: center; gap: 10px;
      color: var(--text); text-align: left; cursor: pointer;
    }
    .chapter-row:last-child { border-bottom: none; }
    .chap-icon {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #dbeafe, #e0f2fe);
      display: flex; align-items: center; justify-content: center; font-size: 21px;
      border: 1px solid var(--border);
    }
    body.dark .chap-icon { background: linear-gradient(135deg, #1e3a5f, #0f172a); }
    .chap-info { flex: 1; min-width: 0; }
    .chap-name { font-size: 14px; font-weight: 700; }
    .chap-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .count-circle {
      min-width: 26px; height: 26px; padding: 0 7px; border-radius: 999px;
      border: 1px solid var(--border); color: var(--muted);
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;
    }
    .chap-arrow {
      width: 24px; height: 24px; border-radius: 999px; background: var(--muted); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; opacity: 0.7;
    }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .chip {
      white-space: nowrap; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--card); border: 1px solid var(--border); color: var(--text); cursor: pointer;
    }
    .chip.active { background: var(--nav-bg); color: #fff; border-color: var(--nav-bg); }
    .book-sheet {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 12px; margin-bottom: 10px;
    }
    .book-entry { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .book-entry:last-child { border-bottom: none; }
    .rubric-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .rubric-title { font-size: 15px; line-height: 1.35; flex: 1; }
    .rubric-title strong { font-weight: 800; }
    .rubric-sub { color: var(--muted); font-weight: 500; }
    .rems-inline { margin-top: 4px; line-height: 1.55; font-size: 14px; }
    .rem-g3, .rem-g4 { color: var(--g3); font-weight: 800; }
    .rem-g2 { color: var(--g2); font-weight: 700; font-style: italic; }
    .rem-g1 { color: var(--g1); font-weight: 400; }
    .rem-item { display: inline-block; margin-right: 7px; cursor: pointer; }
    .xref-list { margin-top: 4px; display: flex; flex-direction: column; gap: 3px; }
    .xref { color: var(--g3); font-style: italic; font-weight: 600; font-size: 13px; cursor: pointer; }
    .xref-arrow { color: var(--text); font-style: normal; margin-right: 4px; }
    .pager { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; gap: 8px; }
    .btn-sm {
      padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-weight: 700;
      background: var(--primary-soft); color: var(--primary); cursor: pointer; white-space: nowrap;
    }
    .btn-sm.added { background: var(--nav-bg); color: #fff; border-color: var(--nav-bg); }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 12px; margin-bottom: 8px;
    }
    .rubric-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .matrix-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 7px 6px; text-align: center; }
    th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); min-width: 145px; max-width: 185px; }
    .g-cell-3, .g-cell-4 { color: var(--g3); font-weight: 800; }
    .g-cell-2 { color: var(--g2); font-weight: 700; font-style: italic; }
    .g-cell-1 { color: var(--g1); }
    .status { text-align: center; padding: 26px 12px; color: var(--muted); font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="nav-grid">
      <button class="nav-item active" data-tab="browse"><span class="ico">🏠</span>Chapters</button>
      <button class="nav-item" data-tab="search"><span class="ico">🔍</span>Search</button>
      <button class="nav-item" data-tab="clip"><span class="ico">📋</span>Clipboard<span id="clipBadge" class="badge hidden">0</span></button>
      <button class="nav-item" data-tab="remedy"><span class="ico">💊</span>Rem. list</button>
    </div>
    <div class="subbar">
      <button class="sub-btn hidden" id="backBtn">↩ Back</button>
      <div class="crumb-pills" id="crumbPills"><button class="crumb-pill">Chapters</button></div>
      <button class="sub-btn hidden" id="modeBtn">📖 Book</button>
      <select id="repSelect" class="rep-select"></select>
      <button class="sub-btn" id="themeBtn">◐</button>
    </div>
  </header>

  <main class="container">
    <section id="view-browse">
      <input id="chapFilter" class="search-box" type="search" placeholder="Type chapter..." />
      <div id="browseList"></div>
    </section>

    <section id="view-search" class="hidden">
      <input id="searchInput" class="search-box" type="search" placeholder="Search all rubrics (e.g. forsaken, anxiety night)..." />
      <div class="chips" id="gradeFilters">
        <button class="chip active" data-min="1">All Grades</button>
        <button class="chip" data-min="2">Grade 2+</button>
        <button class="chip" data-min="3">Grade 3 Only</button>
        <button class="chip" data-tab-jump="bookmarks">★ Bookmarks (<span id="bmCount">0</span>)</button>
      </div>
      <div id="searchResults"></div>
    </section>

    <section id="view-bookmarks" class="hidden">
      <div id="bookmarkList"></div>
    </section>

    <section id="view-clip" class="hidden">
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        <button class="btn-sm" id="shareCaseBtn">Share / Copy Case</button>
        <button class="btn-sm" id="clearClipBtn">Clear Clipboard</button>
      </div>
      <div id="clipRubrics"></div>
      <h3 style="font-size:14px;margin:12px 0 8px;">Repertorization Matrix</h3>
      <div id="matrixBox" class="matrix-wrap"></div>
    </section>

    <section id="view-remedy" class="hidden">
      <input id="remSearchInput" class="search-box" type="search" placeholder="Type remedy name (e.g. Acon, Puls, Sulph)..." />
      <div id="remResults"></div>
    </section>

    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:20px;">
      Powered by open-source <a href="https://www.oorep.com/" target="_blank" style="color:var(--primary);">OOREP</a> data (GPL-3.0). Educational &amp; reference tool only.
    </p>
  </main>

  <script>
    const CHAPTER_ORDER = [

    ];
    const CHAPTER_ICONS = {

      nose:'👃', face:'😐', mouth:'👄', teeth:'🦷', throat:'🗣️', 'external throat':'🧣',
      stomach:'🍽️', abdomen:'🩺', rectum:'⭕', stool:'💩', bladder:'💧', kidneys:'🫘',
      'prostate gland':'⚕️', urethra:'〰️', urine:'🧪', 'genitalia male':'♂️', male:'♂️',
      'genitalia female':'♀️', female:'♀️', 'larynx and trachea':'🎙️', larynx:'🎙️',
      respiration:'🫁', cough:'😮‍💨', expectoration:'💨', chest:'❤️', back:'🦴',
      extremities:'🦵', sleep:'😴', dreams:'💭', chill:'🥶', fever:'🌡️',
      perspiration:'💦', skin:'🩹', generals:'⚡', generalities:'⚡'
    };

    const XREF_MAP = {
      abandoned:['mind forsaken'], abashed:['mind embarrassment','mind mortification'],
      ability:['mind exertion mental','mind power mental'], abroad:['mind travelling desire'],
      'absent-minded':['mind abstraction','mind concentration difficult'], absorbed:['mind abstraction'],
      abusive:['mind cursing','mind insulting'], accompanied:['mind company desire'],
      accusations:['mind reproaches'], aching:['pain'], afraid:['fear'],
      anger:['mind irascibility','mind rage'], anguish:['mind anxiety','mind despair'],
      apprehension:['mind anxiety','mind fear'], ashamed:['mind embarrassment'],
      avarice:['mind greed'], bashful:['mind timidity'], bewildered:['mind confusion'],
      bloated:['abdomen distension'], blushing:['face redness'], boasting:['mind haughty'],
      boredom:['mind ennui'], bruised:['sore'], calm:['mind tranquil'],
      capricious:['mind changeable'], careless:['mind heedless'], chattering:['mind loquacity'],
      cheerful:['mind mirth'], chilly:['chill','cold'], choking:['throat constriction'],
      clumsy:['awkward'], complaining:['mind lamenting'], conceited:['mind haughty'],
      confusion:['mind dullness'], constipation:['stool hard','rectum inactivity'],
      contemptuous:['mind haughty'], convulsions:['spasms'], cowardice:['mind timidity'],
      craving:['desires'], crying:['mind weeping'], cursing:['mind swearing'],
      darkness:['fear dark'], dazed:['mind stupefaction'], deceitful:['mind lying'],
      delirium:['mind mania','mind raving'], delusions:['mind illusions'],
      depressed:['mind sadness'], despair:['mind hopelessness','mind sadness'],
      despondency:['mind sadness'], diarrhea:['stool watery','stool frequent'],
      dizziness:['vertigo'], dread:['fear'], drowsy:['sleepiness'],
      dullness:['mind sluggishness'], dyspnea:['respiration difficult'],
      ecstasy:['mind exhilaration'], egotism:['mind haughty'],
      embarrassment:['mind mortification'], emptiness:['hollow'], ennui:['mind weary life'],
      envy:['mind jealousy'], exhaustion:['weakness'], fainting:['syncope'],
      fatigue:['weariness'], fear:['mind fright'], fidgety:['mind restlessness'],
      flatulence:['abdomen distension'], forgetful:['mind memory weakness'],
      forsaken:['mind abandoned','mind company'], giddiness:['vertigo'],
      grief:['mind sadness','mind ailments grief'], groaning:['mind moaning'],
      hallucinations:['mind delusions'], haste:['mind hurry'], hatred:['mind malice'],
      haughty:['mind pride'], headache:['head pain'], heartburn:['stomach eructations'],
      heaviness:['weight'], homesickness:['mind nostalgia'], hopelessness:['mind despair'],
      hurry:['mind haste'], idle:['mind indolence'], illusions:['mind delusions'],
      impatience:['mind irritability','mind restlessness'], impulsive:['mind rashness'],
      indecision:['mind irresolution'], indifference:['mind apathy'],
      indignation:['mind anger','mind mortification'], indolence:['mind laziness'],
      insanity:['mind mania'], insomnia:['sleep sleeplessness'], irascibility:['mind anger'],
      irresolution:['mind indecision'], irritability:['mind anger','mind morose'],
      itching:['pruritus'], jealousy:['mind envy'], joy:['mind mirth'],
      lamenting:['mind weeping'], languor:['lassitude'], laughing:['mind mirth'],
      laziness:['mind indolence'], lethargy:['sleepiness','mind dullness'],
      lightheaded:['vertigo'], listless:['mind indifference'], loathing:['aversion'],
      loneliness:['mind forsaken'], loquacity:['mind talking'], 'low-spirited':['mind sadness'],
      madness:['mind mania'], malice:['mind spiteful'], mania:['mind insanity','mind rage'],
      melancholy:['mind sadness'], mirth:['mind cheerfulness'], miserly:['mind avarice'],
      moaning:['mind groaning'], moody:['mind changeable'], morose:['mind irritability'],
      mortification:['mind embarrassment'], nervous:['mind restlessness','mind anxiety'],
      nightmare:['dreams frightful'], numbness:['insensibility'], obstinate:['mind headstrong'],
      offended:['mind sensitive'], palpitation:['chest palpitation'],
      panic:['mind fear','mind anxiety'], paranoia:['mind suspicious'], pining:['mind grief'],
      pride:['mind haughty'], prostration:['weakness'], quarrelsome:['mind anger'],
      quiet:['mind tranquil'], rage:['mind fury','mind anger'], raving:['mind delirium'],
      remorse:['mind reproaches'], reproaches:['mind remorse'], restlessness:['mind anxiety'],
      sadness:['mind grief','mind weeping'], screaming:['mind shrieking'],
      seclusion:['mind company aversion'], sensitive:['mind oversensitive'],
      shame:['mind embarrassment'], shivering:['chill'], shrieking:['mind screaming'],
      shy:['mind timidity'], silent:['mind taciturn'], sleeplessness:['sleep waking'],
      sluggish:['mind indolence'], sobbing:['mind weeping'],
      solitude:['mind company aversion','mind forsaken'], somnolence:['sleepiness'],
      sore:['bruised'], sorrow:['mind grief'], spasms:['convulsions'],
      spiteful:['mind malice'], startled:['mind fright'], stiffness:['rigidity'],
      stupor:['unconsciousness'], sulky:['mind morose'], suspicious:['mind distrustful'],
      swearing:['mind cursing'], sweating:['perspiration'], taciturn:['mind silent'],
      talkative:['mind loquacity'], tears:['mind weeping'], terror:['mind fright'],
      throbbing:['pulsation'], timidity:['mind bashful'], tired:['weakness'],
      trembling:['shaking'], unconsciousness:['coma'], uneasy:['mind restlessness'],
      unhappy:['mind sadness'], vain:['mind haughty'], violent:['mind rage'],
      waking:['sleep sleeplessness'], weakness:['prostration'], weary:['fatigue'],
      weeping:['mind sadness','mind lamenting'], whining:['mind complaining'],
      worry:['mind anxiety'], wretched:['mind despair']
    };

    const state = {
      manifest: [], remedies: {}, currentRep: null, rubrics: [], byId: new Map(),
      tree: null, navPath: [], bookMode: false, page: 0, pageSize: 50,
      treeLimit: 120,
      clipboard: JSON.parse(localStorage.getItem('rep_clip') || '[]'),
      bookmarks: JSON.parse(localStorage.getItem('rep_bm') || '[]'),
      minGrade: 1, searchLimit: 60, remLimit: 60
    };

    const $ = id => document.getElementById(id);
    if (localStorage.getItem('rep_dark') === '1') document.body.classList.add('dark');
    $('themeBtn').onclick = () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('rep_dark', document.body.classList.contains('dark') ? '1' : '0');
    };

    function idbGet(key) {
      return new Promise(res => {
        const req = indexedDB.open('rep_cache', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => {
          const tx = req.result.transaction('kv', 'readonly');
          const g = tx.objectStore('kv').get(key);
          g.onsuccess = () => res(g.result); g.onerror = () => res(null);
        };
        req.onerror = () => res(null);
      });
    }
    function idbSet(key, val) {
      return new Promise(res => {
        const req = indexedDB.open('rep_cache', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => {
          const tx = req.result.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(val, key); tx.oncomplete = () => res();
        };
        req.onerror = () => res();
      });
    }
    async function fetchCached(url) {
      const cached = await idbGet(url);
      if (cached) return cached;
      const r = await fetch(url);
      const data = await r.json();
      idbSet(url, data);
      return data;
    }

    async function init() {
      $('browseList').innerHTML = '<div class="status">Loading repertory database...</div>';
      try {
        const [manifest, remedies] = await Promise.all([
          fetchCached('data/manifest.json'), fetchCached('data/remedies.json')
        ]);
        state.manifest = manifest; state.remedies = remedies;
        $('repSelect').innerHTML = manifest.map(m =>
          `<option value="${m.abbrev}">${m.title} (${m.count.toLocaleString()})</option>`
        ).join('');
        const kent = manifest.find(m => m.abbrev.toLowerCase() === 'kent')
          || manifest.find(m => m.abbrev.toLowerCase().includes('kent')) || manifest[0];
        if (kent) { $('repSelect').value = kent.abbrev; await loadRepertory(kent.abbrev); }
        updateBadges();
      } catch (e) {
        $('browseList').innerHTML = '<div class="status">Could not load database yet. Please refresh in a moment.</div>';
      }
    }

    function buildTree(rubrics) {
      const root = { name: 'Chapters', children: new Map(), rubric: null, allItems: [] };
      for (const r of rubrics) {
        const rawPath = r[2] || r[3] || '';
        const parts = rawPath.split(',').map(s => s.trim()).filter(Boolean);
        if (!parts.length) continue;
        let cur = root;
        for (const part of parts) {
          const key = part.toLowerCase();
          if (!cur.children.has(key)) {
            cur.children.set(key, { name: part, children: new Map(), rubric: null, allItems: [] });
          }
          cur = cur.children.get(key);
          cur.allItems.push(r);
        }
        cur.rubric = r;
      }
      return root;
    }

    async function loadRepertory(abbrev) {
      const info = state.manifest.find(m => m.abbrev === abbrev);
      if (!info) return;
      state.currentRep = info;
      $('browseList').innerHTML = `<div class="status">Indexing ${info.title}...</div>`;
      const raw = await fetchCached('data/' + info.file);
      state.rubrics = raw; state.byId.clear();
      for (const r of raw) state.byId.set(r[0], r);
      state.tree = buildTree(raw);
      state.navPath = []; state.page = 0; state.treeLimit = 120; $('chapFilter').value = '';
      renderBrowse();
      if ($('searchInput').value.trim()) renderSearch();
    }

    $('repSelect').onchange = e => loadRepertory(e.target.value);
    function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function rubricLabel(r) { return r[2] || r[3] || ('Rubric #' + r[0]); }

    function formatInlineRemedies(rems) {
      if (!rems || !rems.length) return '';
      return rems.slice().sort((a,b) => {
        const ra = (state.remedies[a[0]] || {}).a || '';
        const rb = (state.remedies[b[0]] || {}).a || '';
        return ra.localeCompare(rb);
      }).map(([rid, w]) => {
        const rem = state.remedies[rid] || { a: '#' + rid, n: '' };
        const cls = w >= 3 ? 'rem-g3' : w === 2 ? 'rem-g2' : 'rem-g1';
        const label = w === 1 ? rem.a.toLowerCase() : rem.a;
        return `<span class="rem-item ${cls}" title="${esc(rem.n)}" onclick="lookupRemedy('${esc(rem.a)}')">${esc(label)}</span>`;
      }).join('');
    }

    function findCrossRefs(r) {
      const full = rubricLabel(r).toLowerCase();
      const parts = full.split(',').map(s => s.trim()).filter(Boolean);
      const chap = parts[0] || '', sub = parts[1] || parts[0] || '';
      const words = sub.replace(/[^a-z-\s]/g, ' ').split(/\s+/).filter(w => w.length >= 3);
      const refs = [], seen = new Set();
      for (const w of [sub, ...words]) {
        const targets = XREF_MAP[w];
        if (targets) for (const t of targets) if (!seen.has(t)) { seen.add(t); refs.push(t); }
      }
      if (!refs.length && words.length) refs.push(`${chap} ${words[0]}`.trim());
      return refs.slice(0, 3);
    }

    function renderBookEntry(r) {
      const id = r[0], rems = r[4] || [];
      const clipKey = `${state.currentRep.abbrev}:${id}`;
      const isAdded = state.clipboard.some(c => c.key === clipKey);
      const isBm = state.bookmarks.some(b => b.key === clipKey);
      const xrefs = rems.length === 0 ? findCrossRefs(r) : [];
      const parts = rubricLabel(r).split(',').map(s => s.trim()).filter(Boolean);
      const titleHtml = `<strong>${esc((parts[0] || '').toUpperCase())}</strong>` +
        (parts.length > 1 ? ` <span class="rubric-sub">· ${esc(parts.slice(1).join(' › '))}</span>` : '');
      return `
        <div class="book-entry">
          <div class="rubric-head">
            <div class="rubric-title">${titleHtml}</div>
            <div style="display:flex;gap:4px;">
              <button class="btn-sm ${isBm ? 'added' : ''}" onclick="toggleBm(${id})">${isBm ? '★' : '☆'}</button>
              <button class="btn-sm ${isAdded ? 'added' : ''}" onclick="toggleClip(${id})">${isAdded ? '✓' : '+ Case'}</button>
            </div>
          </div>
          ${rems.length
            ? `<div class="rems-inline">${formatInlineRemedies(rems)}</div>`
            : `<div class="xref-list">${xrefs.map(x => `<div class="xref" onclick="quickSearch('${esc(x).replace(/'/g, "\\'")}')"><span class="xref-arrow">↗</span>${esc(x.toUpperCase())}</div>`).join('')}</div>`
          }
        </div>
      `;
    }

    function getNodeAt(pathKeys) {
      let cur = state.tree;
      for (const k of pathKeys) {
        if (!cur || !cur.children.has(k)) return null;
        cur = cur.children.get(k);
      }
      return cur;
    }

    function sortEntries(entries, isRoot) {
      return entries.sort((a, b) => {
        if (isRoot) {
          const ia = CHAPTER_ORDER.indexOf(a[0]), ib = CHAPTER_ORDER.indexOf(b[0]);
          if (ia !== -1 && ib !== -1) return ia - ib;
          if (ia !== -1) return -1; if (ib !== -1) return 1;
        }
        return a[1].name.localeCompare(b[1].name);
      });
    }

    function renderBrowse() {
      if (!state.tree) return;
      const isRoot = state.navPath.length === 0;
      $('backBtn').classList.toggle('hidden', isRoot);
      $('modeBtn').classList.toggle('hidden', isRoot);
      $('modeBtn').textContent = state.bookMode ? '📂 Tree' : '📖 Book';

      // Build clickable breadcrumb pills
      const pills = [`<button class="crumb-pill" onclick="jumpPath(-1)">Chapters</button>`];
      let walk = state.tree;
      state.navPath.forEach((k, i) => {
        walk = walk && walk.children.get(k);
        const label = walk ? walk.name.toUpperCase().slice(0, 18) : k.toUpperCase();
        pills.push(`<button class="crumb-pill" onclick="jumpPath(${i})">${esc(label)}</button>`);
      });
      $('crumbPills').innerHTML = pills.join('');

      const node = getNodeAt(state.navPath);
      if (!node) return;
      const q = $('chapFilter').value.trim().toLowerCase();
      $('chapFilter').placeholder = isRoot ? 'Type chapter...' : 'Type a few characters of the rubric...';

      if (!isRoot && state.bookMode) {
        let items = node.allItems.slice().sort((a,b) => rubricLabel(a).localeCompare(rubricLabel(b)));
        if (q) {
          const terms = q.split(/\s+/).filter(Boolean);
          items = items.filter(r => terms.every(t => rubricLabel(r).toLowerCase().includes(t)));
        }
        const totalPages = Math.max(1, Math.ceil(items.length / state.pageSize));
        if (state.page >= totalPages) state.page = totalPages - 1;
        const slice = items.slice(state.page * state.pageSize, (state.page + 1) * state.pageSize);
        const pager = `
          <div class="pager">
            <button class="btn-sm" ${state.page === 0 ? 'disabled' : ''} onclick="setPage(${state.page - 1})">← Prev</button>
            <span class="rubric-meta">Page ${state.page + 1}/${totalPages} (${items.length.toLocaleString()})</span>
            <button class="btn-sm" ${state.page >= totalPages - 1 ? 'disabled' : ''} onclick="setPage(${state.page + 1})">Next →</button>
          </div>
        `;
        $('browseList').innerHTML = slice.length
          ? pager + `<div class="book-sheet">` + slice.map(renderBookEntry).join('') + `</div>` + pager
          : '<div class="status">No matching rubrics.</div>';
        return;
      }

      // Tree View (grouped sub-rubrics like Synthesis)
      let html = '';
      if (!isRoot && node.rubric) {
        html += `<div class="book-sheet">` + renderBookEntry(node.rubric) + `</div>`;
      }
      let entries = sortEntries([...node.children.entries()], isRoot);
      if (q) entries = entries.filter(([, child]) => child.name.toLowerCase().includes(q));

      const slice = entries.slice(0, state.treeLimit);
      if (slice.length) {
        html += '<div class="chapter-list">' + slice.map(([key, child]) => {
          const sub = child.children.size;
          const icon = isRoot ? `<div class="chap-icon">${CHAPTER_ICONS[key] || '📖'}</div>` : '';
          const badge = isRoot
            ? `<span class="chap-meta" style="margin-right:4px;">${child.allItems.length.toLocaleString()}</span>`
            : `<span class="count-circle">${sub}</span>`;
          return `<button class="chapter-row" onclick="pushPath('${esc(key).replace(/'/g, "\\'")}')">
            ${icon}
            <div class="chap-info">
              <div class="chap-name">${isRoot ? esc(child.name.toUpperCase()) : esc(child.name)}</div>
            </div>
            ${badge}
            <div class="chap-arrow">➜</div>
          </button>`;
        }).join('') + '</div>';
      }
      if (entries.length > slice.length) {
        html += `<button class="btn-sm" style="width:100%;margin-top:8px;padding:10px;" onclick="state.treeLimit+=120;renderBrowse()">Show more (${entries.length - slice.length} remaining)</button>`;
      }
      $('browseList').innerHTML = html || '<div class="status">No matching rubrics.</div>';
    }

    $('modeBtn').onclick = () => { state.bookMode = !state.bookMode; state.page = 0; renderBrowse(); };
    window.pushPath = key => { state.navPath.push(key); $('chapFilter').value = ''; state.treeLimit = 120; state.page = 0; renderBrowse(); window.scrollTo(0, 0); };
    window.jumpPath = idx => { state.navPath = idx < 0 ? [] : state.navPath.slice(0, idx + 1); $('chapFilter').value = ''; state.treeLimit = 120; state.page = 0; renderBrowse(); };
    $('backBtn').onclick = () => { if (state.navPath.length) { state.navPath.pop(); $('chapFilter').value = ''; state.page = 0; renderBrowse(); } };
    $('chapFilter').oninput = () => { state.treeLimit = 120; state.page = 0; renderBrowse(); };
    window.setPage = p => { state.page = Math.max(0, p); renderBrowse(); window.scrollTo(0, 0); };

    window.quickSearch = query => { switchTab('search'); $('searchInput').value = query; state.searchLimit = 60; renderSearch(); window.scrollTo(0, 0); };

    window.toggleClip = id => {
      const r = state.byId.get(id); if (!r) return;
      const key = `${state.currentRep.abbrev}:${id}`;
      const idx = state.clipboard.findIndex(c => c.key === key);
      if (idx >= 0) state.clipboard.splice(idx, 1);
      else state.clipboard.push({ key, rep: state.currentRep.abbrev, path: rubricLabel(r), weight: 1, rems: r[4] || [] });
      localStorage.setItem('rep_clip', JSON.stringify(state.clipboard));
      updateBadges(); refreshActiveView();
    };
    window.toggleBm = id => {
      const r = state.byId.get(id); if (!r) return;
      const key = `${state.currentRep.abbrev}:${id}`;
      const idx = state.bookmarks.findIndex(b => b.key === key);
      if (idx >= 0) state.bookmarks.splice(idx, 1);
      else state.bookmarks.push({ key, id, rep: state.currentRep.abbrev, path: rubricLabel(r), rems: r[4] || [] });
      localStorage.setItem('rep_bm', JSON.stringify(state.bookmarks));
      updateBadges(); refreshActiveView();
    };
    function updateBadges() {
      const b = $('clipBadge');
      b.textContent = state.clipboard.length;
      b.classList.toggle('hidden', state.clipboard.length === 0);
      $('bmCount').textContent = state.bookmarks.length;
    }
    function refreshActiveView() {
      if (!$('view-browse').classList.contains('hidden')) renderBrowse();
      if (!$('view-search').classList.contains('hidden')) renderSearch();
      if (!$('view-clip').classList.contains('hidden')) renderClip();
      if (!$('view-bookmarks').classList.contains('hidden')) renderBookmarks();
    }

    function renderSearch() {
      const q = $('searchInput').value.trim().toLowerCase();
      if (q.length < 2) { $('searchResults').innerHTML = '<div class="status">Type at least 2 letters to search across all rubrics.</div>'; return; }
      const terms = q.split(/\s+/).filter(Boolean);
      const matches = [];
      for (const r of state.rubrics) {
        const text = (r[2] + ' ' + r[3]).toLowerCase();
        if (!terms.every(t => text.includes(t))) continue;
        const rems = state.minGrade > 1 ? (r[4] || []).filter(x => x[1] >= state.minGrade) : (r[4] || []);
        if (state.minGrade > 1 && rems.length === 0) continue;
        matches.push(r);
      }
      const slice = matches.slice(0, state.searchLimit);
      $('searchResults').innerHTML =
        `<div class="rubric-meta" style="margin-bottom:8px;">${matches.length.toLocaleString()} matching rubrics</div>` +
        (slice.length ? `<div class="book-sheet">` + slice.map(renderBookEntry).join('') + `</div>` : '') +
        (matches.length > slice.length ? `<button class="btn-sm" style="width:100%;margin-top:8px;padding:10px;" onclick="state.searchLimit+=60;renderSearch()">Load more results</button>` : '');
    }

    let searchTimer;
    $('searchInput').oninput = () => { state.searchLimit = 60; clearTimeout(searchTimer); searchTimer = setTimeout(renderSearch, 180); };
    $('gradeFilters').onclick = e => {
      if (e.target.dataset.tabJump) { switchTab(e.target.dataset.tabJump); return; }
      if (!e.target.dataset.min) return;
      state.minGrade = Number(e.target.dataset.min);
      [...$('gradeFilters').children].forEach(b => { if (b.dataset.min) b.classList.toggle('active', b === e.target); });
      renderSearch();
    };

    function renderBookmarks() {
      if (!state.bookmarks.length) { $('bookmarkList').innerHTML = '<div class="status">No bookmarks yet. Tap ☆ on any rubric to save it here.</div>'; return; }
      $('bookmarkList').innerHTML = `<div class="book-sheet">` + state.bookmarks.map(b => renderBookEntry([b.id, null, b.path, b.path, b.rems])).join('') + `</div>`;
    }

    function renderClip() {
      if (!state.clipboard.length) {
        $('clipRubrics').innerHTML = '<div class="status">Clipboard is empty. Tap "+ Case" on any rubric to repertorize.</div>';
        $('matrixBox').innerHTML = ''; return;
      }
      $('clipRubrics').innerHTML = state.clipboard.map((c, idx) => `
        <div class="card">
          <div class="rubric-head">
            <div><div class="rubric-title"><strong>${esc(c.path)}</strong></div><div class="rubric-meta">${esc(c.rep)} · ${c.rems.length} remedies · Weight: ${c.weight}x</div></div>
            <div style="display:flex;gap:4px;"><button class="btn-sm" onclick="cycleWeight(${idx})">${c.weight}x</button><button class="btn-sm" onclick="removeClip(${idx})">✕</button></div>
          </div>
        </div>
      `).join('');
      const scores = new Map();
      state.clipboard.forEach((c, rIdx) => {
        for (const [rid, w] of c.rems) {
          if (!scores.has(rid)) scores.set(rid, { rid, total: 0, cov: 0, grades: {} });
          const s = scores.get(rid);
          s.total += w * c.weight; s.cov += 1; s.grades[rIdx] = Math.max(s.grades[rIdx] || 0, w);
        }
      });
      const top = [...scores.values()].sort((a,b) => (b.cov - a.cov) || (b.total - a.total)).slice(0, 25);
      $('matrixBox').innerHTML = `<table>
        <thead><tr><th>Rubric (${state.clipboard.length})</th>${top.map(t => `<th>${esc((state.remedies[t.rid]||{a:t.rid}).a)}<br><small>${t.cov}/${state.clipboard.length} (${t.total})</small></th>`).join('')}</tr></thead>
        <tbody>${state.clipboard.map((c, rIdx) => `<tr><td>${esc(c.path.slice(0, 42))}</td>${top.map(t => {
          const g = t.grades[rIdx] || 0;
          return `<td class="${g ? 'g-cell-'+g : ''}">${g || '·'}</td>`;
        }).join('')}</tr>`).join('')}</tbody>
      </table>`;
    }

    window.cycleWeight = idx => { state.clipboard[idx].weight = (state.clipboard[idx].weight % 3) + 1; localStorage.setItem('rep_clip', JSON.stringify(state.clipboard)); renderClip(); };
    window.removeClip = idx => { state.clipboard.splice(idx, 1); localStorage.setItem('rep_clip', JSON.stringify(state.clipboard)); updateBadges(); renderClip(); };
    $('clearClipBtn').onclick = () => { state.clipboard = []; localStorage.setItem('rep_clip', '[]'); updateBadges(); renderClip(); };
    $('shareCaseBtn').onclick = async () => {
      if (!state.clipboard.length) return;
      const text = ['Homeopathic Case Repertorization:', ...state.clipboard.map((c,i) => `${i+1}. [${c.weight}x] ${c.path}`)].join('\n');
      if (navigator.share) await navigator.share({ title: 'Case Repertorization', text });
      else { await navigator.clipboard.writeText(text); alert('Case copied!'); }
    };

    window.lookupRemedy = abbrev => { switchTab('remedy'); $('remSearchInput').value = abbrev; renderRemedyLookup(); };
    function renderRemedyLookup() {
      const q = $('remSearchInput').value.trim().toLowerCase();
      if (!q) { $('remResults').innerHTML = '<div class="status">Enter a remedy abbreviation or full name to see its rubrics.</div>'; return; }
      const matched = Object.entries(state.remedies).filter(([, v]) => v.a.toLowerCase().includes(q) || v.n.toLowerCase().includes(q)).slice(0, 8);
      if (!matched.length) { $('remResults').innerHTML = '<div class="status">No matching remedy found.</div>'; return; }
      const targetId = Number(matched[0][0]), info = matched[0][1];
      const hits = [];
      for (const r of state.rubrics) {
        const f = (r[4] || []).find(x => x[0] === targetId);
        if (f) hits.push({ r, w: f[1] });
      }
      hits.sort((a,b) => b.w - a.w);
      $('remResults').innerHTML = `<div class="card"><strong>${esc(info.a)}</strong> — ${esc(info.n)}<div class="rubric-meta">${hits.length.toLocaleString()} rubrics in ${esc(state.currentRep.title)}</div></div>` +
        hits.slice(0, state.remLimit).map(h => `<div class="card"><span class="rem-g${h.w}">Grade ${h.w}</span> · ${esc(rubricLabel(h.r))}</div>`).join('');
    }
    $('remSearchInput').oninput = () => { state.remLimit = 60; renderRemedyLookup(); };

    function switchTab(tab) {
      ['browse','search','clip','remedy','bookmarks'].forEach(t => $(`view-${t}`).classList.toggle('hidden', t !== tab));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      if (tab === 'browse') {
        renderBrowse();
      } else {
        $('backBtn').classList.add('hidden');
        $('modeBtn').classList.add('hidden');
        const titles = { search:'Search Rubrics', clip:'Clipboard', remedy:'Remedy List', bookmarks:'Bookmarks' };
        $('crumbPills').innerHTML = `<button class="crumb-pill">${titles[tab] || 'Repertory'}</button>`;
      }
      if (tab === 'clip') renderClip();
      if (tab === 'bookmarks') renderBookmarks();
    }
    document.querySelectorAll('.nav-item').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

    init();
  </script>
</body>
</html>
